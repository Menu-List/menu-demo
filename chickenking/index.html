*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}
/* ==== Splash ==== */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#33270E 0%,#1D1507 55%,#0D0903 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:transform .65s cubic-bezier(.76,0,.24,1)}
#splash.hide{transform:translateY(-101%)}
#splash img{width:150px;height:150px;border-radius:50%;animation:splashIn .6s cubic-bezier(.2,1.4,.4,1) both, splashPulse .8s .6s ease-in-out infinite alternate}
@keyframes splashIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes splashPulse{from{box-shadow:0 0 0 5px rgba(217,164,22,.35),0 0 22px 4px rgba(217,164,22,.4)}to{box-shadow:0 0 0 10px rgba(217,164,22,.5),0 0 46px 16px rgba(217,164,22,.6)}}
#splash .nm{font-size:33px;font-weight:900;color:#F5CF5A;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:splashIn .6s .12s cubic-bezier(.2,1.4,.4,1) both}
#splash .sm{font-size:14px;font-weight:700;color:#D9C48D;animation:splashIn .6s .22s both}
/* ==== App bar ==== */
#appbar{position:fixed;top:0;left:0;right:0;height:var(--appbar-h);z-index:80;background:rgba(251,246,234,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;transform:translateY(-105%);transition:transform .3s ease}
body.scrolled #appbar{transform:none}
#appbar img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold)}
#appbar .t{flex:1;font-weight:900;font-size:17px}
#appbar a.call{background:var(--gold-dk);color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px}

#logoScroll{position:relative;will-change:transform,opacity}
.logoWrap{position:relative;display:inline-block;border-radius:22px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.55),0 0 0 5px rgba(217,164,22,.4);animation:floaty 3.4s ease-in-out infinite;cursor:pointer;line-height:0;background:#000}

.logoWrap::after{content:"";position:absolute;top:-70%;bottom:-70%;width:42%;left:-90%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.6s ease-in-out infinite;pointer-events:none}

/* ===== Splash (once per session, curtain lift) ===== */
(function(){
  var sp = document.getElementById('splash');
  if(sessionStorage.getItem('cking_splash')==='1'){ sp.remove(); startCounters(300); return; }
  sessionStorage.setItem('cking_splash','1');
  setTimeout(function(){ sp.classList.add('hide'); startCounters(500); setTimeout(function(){ sp.remove(); }, 750); }, 1500);
})();

/* ===== Count-up stats ===== */
function startCounters(delay){
  setTimeout(function(){
    document.querySelectorAll('.num[data-count]').forEach(function(el){
      var target = +el.dataset.count, suffix = el.dataset.suffix||'', t0 = null;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min((ts-t0)/900, 1), e = 1-Math.pow(1-p,3);
        el.textContent = Math.round(target*e) + suffix;
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }, delay||0);
}

/* ===== Scroll: hero logo morph + app bar ===== */
var logoScrollEl = document.getElementById('logoScroll');
window.addEventListener('scroll', function(){
  var y = window.scrollY, p = Math.min(y/240, 1);
  document.body.classList.toggle('scrolled', y > 240);
  if(logoScrollEl){
    logoScrollEl.style.transform = 'scale(' + (1 - .42*p) + ') translateY(' + (-26*p) + 'px)';
    logoScrollEl.style.opacity = 1 - .5*p;
  }
}, {passive:true});

/* ===== Logo tap: dance + crown burst ===== */
function spawnStars(cx, cy, n){
  var glyphs = ['👑','⭐','✨','👑','⭐'];
  for(var i=0;i<(n||7);i++){
    var s = document.createElement('span');
    s.className = 'star'; s.textContent = glyphs[i % glyphs.length];
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    document.body.appendChild(s);
    var dx = (Math.random()*2-1) * 110, dy = -(40 + Math.random()*110);
    s.animate([
      {transform:'translate(-50%,-50%) scale(.4)', opacity:1},
      {transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1.15) rotate(' + (Math.random()*160-80) + 'deg)', opacity:0}
    ], {duration:750 + Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = (function(el){ return function(){ el.remove(); }; })(s);
  }
}
document.getElementById('logoWrap').addEventListener('click', function(){
  var img = document.getElementById('heroLogo'), r = img.getBoundingClientRect();
  img.classList.remove('dance'); void img.offsetWidth; img.classList.add('dance');
  spawnStars(r.left + r.width/2, r.top + r.height/2, 8);
  if(navigator.vibrate) navigator.vibrate(15);
});

  const el = $("chips");
  el.innerHTML = `<button class="chip active" data-c="all">الكل 🍽️</button>` +
    CATS.map(c=>`<button class="chip" data-c="${c.id}">${c.icon} ${c.name}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const t = b.dataset.c==="all" ? document.body : document.getElementById("cat-"+b.dataset.c);
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
}
function stepperHTML(id){
  const q = cart[id]||0;
  if(q===0) return `<div class="stepper"><button class="add" onclick="chQty('${id}',1,event)">أضف +</button></div>`;
  return `<div class="stepper"><button onclick="chQty('${id}',1,event)">+</button><span class="qty">${q}</span><button onclick="chQty('${id}',-1,event)">−</button></div>`;
}
function renderMenu(){
  const main = $("menu");
  main.innerHTML = CATS.map(c=>{
    const items = MENU.filter(i=>i.cat===c.id);
    return `<section class="cat" id="cat-${c.id}"><h2>${c.icon} ${c.name} <span class="count">${items.length}</span></h2>` +
      items.map(i=>`<div class="item reveal"><div class="info"><div class="name">${i.name}</div></div><span id="st-${i.id}">${stepperHTML(i.id)}</span></div>`).join("") + `</section>`;
  }).join("");
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.08});
  main.querySelectorAll(".reveal").forEach((el,i)=>{ el.style.transitionDelay = (i%5)*35 + "ms"; io.observe(el); });
  main.querySelectorAll(".item").forEach(card=>{
    card.addEventListener("pointerdown", ()=>card.classList.add("press"));
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>card.addEventListener(ev, ()=>card.classList.remove("press")));
  });
  spyInit();
  updateBar();
}
function spyInit(){
  const chips = document.querySelectorAll(".chip");
  const so = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        chips.forEach(ch=>{
          const on = ch.dataset.c===e.target.id.replace("cat-","");
          ch.classList.toggle("active", on);
          if(on) ch.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
        });
      }
    });
  }, {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("section.cat").forEach(s=>so.observe(s));
}
function flyToCart(x, y){
  const bar = $("cartbar");
  if(!bar.classList.contains("show")) return;
  const r = bar.getBoundingClientRect();
  const tx = r.left + r.width/2, ty = r.top + r.height/2;
  const dot = document.createElement("div");
  dot.className = "flyDot"; dot.textContent = "👑";
  dot.style.left = (x-13) + "px"; dot.style.top = (y-13) + "px";
  document.body.appendChild(dot);
  const dx = tx-x, dy = ty-y;
  dot.animate([
    {transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1},
    {transform:`translate(${dx*.5}px, ${dy-130}px) scale(.95) rotate(160deg)`, opacity:1, offset:.55},
    {transform:`translate(${dx}px, ${dy}px) scale(.2) rotate(320deg)`, opacity:.5}
  ], {duration:680, easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish = ()=>dot.remove();
}
function chQty(id,d,ev){
  let sx=null, sy=null;
  if(d>0 && ev && ev.currentTarget){
    const r = ev.currentTarget.getBoundingClientRect();
    sx = r.left + r.width/2; sy = r.top + r.height/2;
  }
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  save();
  const wrap = $("st-"+id);
  if(wrap) wrap.innerHTML = stepperHTML(id);
  updateBar();
  if(d>0){
    if(navigator.vibrate) navigator.vibrate(10);
    if(sx!==null) flyToCart(sx, sy);
    const bar = $("cartbar"); bar.classList.remove("pulse"); void bar.offsetWidth; bar.classList.add("pulse");
  }
}
function updateBar(){
  const n = cartCount(), bar = $("cartbar");
  if(n===0){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("cartN").textContent = `🛒 ${n} ${n===1?"صنف":n===2?"صنفان":"أصناف"} بالسلة`;
  $("cartT").textContent = "راجع طلبك وأكد الإرسال 👈";
}
function openOrder(){
  if(cartCount()===0) return;
  const r = $("goOrder").getBoundingClientRect();
  spawnStars(r.left + r.width/2, r.top, 7);
  $("orderLines").innerHTML = Object.entries(cart).map(([id,q])=>{
    const i=byId[id];
    return `<div class="ln"><span>${i.name}</span><span>× ${q}</span></div>`;
  }).join("");
  $("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeOrder(){ $("overlay").classList.remove("show"); document.body.style.overflow=""; }

$("goOrder").onclick = openOrder;
$("cancelOrder").onclick = closeOrder;
$("overlay").addEventListener("click", e=>{ if(e.target===$("overlay")) closeOrder(); });
$("segD").onclick = ()=>{ delivery=true; $("segD").classList.add("active"); $("segP").classList.remove("active"); $("addrField").style.display=""; };
$("segP").onclick = ()=>{ delivery=false; $("segP").classList.add("active"); $("segD").classList.remove("active"); $("addrField").style.display="none"; };

$("sendWa").onclick = ()=>{
  const name=$("fName").value.trim(), phone=$("fPhone").value.trim();
  if(!name){ alert("فضلاً اكتب الاسم الكريم"); $("fName").focus(); return; }
  if(!phone){ alert("فضلاً اكتب رقم الهاتف"); $("fPhone").focus(); return; }
  const addr=$("fAddr").value.trim(), notes=$("fNotes").value.trim();
  const L=[];
  L.push("👑 طلب جديد — ملك الدجاج");
  L.push("———————————");
  Object.entries(cart).forEach(([id,q])=>{ const i=byId[id]; L.push(`${q} × ${i.name}`); });
  L.push("———————————");
  L.push(`👤 الاسم: ${name}`);
  L.push(`📞 الهاتف: ${phone}`);
  L.push(delivery ? `🛵 توصيل إلى: ${addr||"—"}` : "🏃 استلام من المطعم");
  if(notes) L.push(`📝 ملاحظات: ${notes}`);
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(L.join("\n")), "_blank");
};

renderChips(); renderMenu();
</script>

<script>
/* Menu-open tracking (2026-10-19): fire-and-forget ping so Ali can see which
   restaurant owner opened their menu demo link. No cookies, no PII — the server
   only stores the menu slug + timestamp (+hashed IP for country, same as the
   clinic demos' analytics). One ping per browser tab session. */
(function(){try{
  var m=location.pathname.match(/\/menu-demo\/([a-z0-9-]+)\/?(?:[?#]|$)/);
  if(!m)return;
  var slug=m[1];
  if(sessionStorage.getItem('menu_open_logged')===slug)return;
  sessionStorage.setItem('menu_open_logged',slug);
  fetch('https://kindly-anaconda-422.convex.site/trackVisit',{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify({type:'menu_open',label:slug,path:'/menu/'+slug}),
    keepalive:true
  }).catch(function(){});
}catch(e){}})();
</script>
