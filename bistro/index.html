<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bistro - بيسترو | قائمة الطعام</title>
<meta name="description" content="قائمة طعام مطعم Bistro - بيسترو (اللاذقية). اختار وجبتك واطلبها مباشرة عبر واتساب.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bistro - بيسترو | قائمة الطعام">
<meta property="og:description" content="اختار وجبتك من القائمة واطلبها مباشرة عبر واتساب 🍔">
<meta property="og:image" content="https://menu-list.github.io/menu-demo/bistro/og.png">
<meta property="og:url" content="https://menu-list.github.io/menu-demo/bistro/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E07B1A; --brand-dark:#B85F0E; --brand-soft:#FCEFD9;
  --ink:#33241A; --muted:#8A7A6B; --cream:#FFF8EF; --card:#FFFFFF;
  --wa:#1FAF54; --wa-dark:#178A42; --line:#F0E4D2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}
.hero{background:linear-gradient(160deg,var(--brand) 0%,#D2690F 60%,#B85F0E 100%);color:#fff;text-align:center;padding:34px 18px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.18),transparent 45%)}
.hero img.logo{width:112px;height:112px;border-radius:50%;border:4px solid rgba(255,255,255,.85);object-fit:cover;background:#fff;position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero h1{font-size:30px;font-weight:900;margin-top:10px;position:relative;z-index:1}
.hero p{opacity:.95;font-size:15px;font-weight:600;position:relative;z-index:1}
.hero .tag{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;position:relative;z-index:1}
.chips{position:sticky;top:0;z-index:50;background:var(--cream);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 14px}
section.cat{margin-top:18px}
section.cat h2{font-size:20px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
section.cat h2 .count{background:var(--brand-soft);color:var(--brand-dark);font-size:12px;padding:2px 10px;border-radius:999px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(51,36,26,.05)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:800;font-size:16px}
.item .desc{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.6}
.item .price{font-weight:900;color:var(--brand-dark);font-size:16px;margin-top:6px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--brand);background:#fff;color:var(--brand);font-size:20px;font-weight:900;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--brand);color:#fff}
.stepper .qty{font-weight:900;font-size:17px;min-width:24px;text-align:center}
.stepper .add{width:auto;padding:0 18px;border-radius:999px;font-size:14px;height:38px;font-family:inherit}
.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(51,36,26,.1)}
.cartbar.show{display:flex}
.cartbar .sum{flex:1}
.cartbar .sum .n{font-size:13px;color:var(--muted);font-weight:600}
.cartbar .sum .t{font-size:19px;font-weight:900}
.cartbar .go{flex:0 0 auto;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:800;font-size:16px;padding:13px 26px;border-radius:14px;cursor:pointer}
.cartbar .go:active{background:var(--wa-dark)}
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.55);z-index:70;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.sheet .lines{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.sheet .lines .ln{display:flex;justify-content:space-between;padding:4px 0;font-weight:600}
.sheet .lines .total{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:900;font-size:16px;color:var(--brand-dark)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:inherit;font-weight:800;font-size:15px;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.seg button.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.sheet .send{width:100%;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:900;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;margin-top:6px}
.sheet .send:active{background:var(--wa-dark)}
.sheet .cancel{width:100%;background:none;border:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:12px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 16px 8px}
footer b{color:var(--brand-dark)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
</style>
</head>
<body>

<header class="hero">
  <img class="logo" src="logo.jpg" alt="Bistro - بيسترو">
  <h1>Bistro - بيسترو</h1>
  <p>اللاذقية</p>
  <span class="tag">اختار وجبتك واطلبها مباشرة عبر واتساب 👇</span>
</header>

<nav class="chips" id="chips"></nav>
<main id="menu"></main>

<div class="cartbar" id="cartbar">
  <div class="sum"><div class="n" id="cartN"></div><div class="t" id="cartT"></div></div>
  <button class="go" id="goOrder">إتمام الطلب</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>إتمام الطلب 🛒</h3>
    <p class="sub">راجع طلبك وعبّي بياناتك، وبكبسة وحدة بينبعت كل شي للمطعم عبر واتساب</p>
    <div class="lines" id="orderLines"></div>
    <div class="field"><label>الاسم الكريم</label><input id="fName" placeholder="مثال: علي حسن"></div>
    <div class="field"><label>رقم الهاتف</label><input id="fPhone" inputmode="tel" placeholder="09xxxxxxxx"></div>
    <div class="field"><label>طريقة الاستلام</label>
      <div class="seg">
        <button type="button" id="segD" class="active">توصيل 🛵</button>
        <button type="button" id="segP">استلام من المطعم 🏃</button>
      </div>
    </div>
    <div class="field" id="addrField"><label>عنوان التوصيل</label><input id="fAddr" placeholder="الحي، الشارع، علامة مميزة"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNotes" rows="2" placeholder="مثال: بدون مخلل، الصوص على جنب"></textarea></div>
    <button class="send" id="sendWa">تأكيد وإرسال عبر واتساب</button>
    <button class="cancel" id="cancelOrder">رجوع للقائمة</button>
  </div>
</div>

<footer>مطعم <b>Bistro - بيسترو</b> — اللاذقية<br>للطلب المباشر عبر واتساب من هذه القائمة</footer>

<script>
const WA_NUMBER = "963992237093";
const CATS = [
  {id:"sandwiches", name:"السندويشات", icon:"🥪"},
  {id:"shawarma",   name:"الشاورما",   icon:"🌯"},
  {id:"burger",     name:"البرغر",     icon:"🍔"},
  {id:"potato",     name:"البطاطا",    icon:"🍟"},
  {id:"meals",      name:"الوجبات",    icon:"🍱"}
];
const MENU = [
  // السندويشات
  {id:"s1", cat:"sandwiches", name:"ساندويش كريسبي", desc:"قطعتين كريسبي، خس، بطاطا، وصوص الكوكتيل", price:350},
  {id:"s2", cat:"sandwiches", name:"ساندويش شيش", desc:"سيخ شيش، بطاطا مقلية، وكريم ثوم", price:350},
  {id:"s3", cat:"sandwiches", name:"ساندويش مكسيكي", desc:"", price:350},
  {id:"s4", cat:"sandwiches", name:"ساندويش فرانسيسكو", desc:"", price:350},
  {id:"s5", cat:"sandwiches", name:"ساندويش فروج", desc:"", price:225},
  {id:"s6", cat:"sandwiches", name:"Magnum Sandwich", desc:"قطعتين دجاج مقلية مع صوص الكوكتيل، الخس، والمايونيز", price:400},
  {id:"s7", cat:"sandwiches", name:"Fajita Sandwich", desc:"دجاج، فليفلة ملونة، بصل، صوص، جبنة، جزر", price:350},
  {id:"s8", cat:"sandwiches", name:"Escalope Sandwich", desc:"إسكالوب، بطاطا، كاتشب، مايونيز", price:350},
  {id:"s9", cat:"sandwiches", name:"Mixed Sandwich", desc:"شاورما مع دجاج كريسبي أو إسكالوب", price:400},
  // الشاورما
  {id:"w1", cat:"shawarma", name:"ساندويش شاورما", desc:"شاورما دجاج، مخلل، كريم ثوم", price:250},
  {id:"w2", cat:"shawarma", name:"ربع كيلو شاورما", desc:"", price:450},
  {id:"w3", cat:"shawarma", name:"وجبة شاورما", desc:"وجبة عادية", price:450},
  {id:"w4", cat:"shawarma", name:"وجبة شاورما دبل", desc:"", price:600},
  {id:"w5", cat:"shawarma", name:"وجبة شاورما بانيه", desc:"", price:550},
  // البرغر
  {id:"b1", cat:"burger", name:"تشيز تشكن برغر", desc:"", price:380},
  {id:"b2", cat:"burger", name:"ساندويش ديفا", desc:"", price:400},
  {id:"b3", cat:"burger", name:"تشكن برغر كلاسيك", desc:"", price:300},
  {id:"b4", cat:"burger", name:"خابي برو ماكس", desc:"", price:400},
  {id:"b5", cat:"burger", name:"Classic Beef Burger", desc:"لحمة برغر، بطاطا، خس، كولسلو، مايونيز، بندورة", price:370},
  {id:"b6", cat:"burger", name:"Beef Cheeseburger", desc:"لحمة برغر، بطاطا، خس، طماطم، جبنة، كولسلو", price:410},
  {id:"b7", cat:"burger", name:"Khabi Burger", desc:"قطعتين صدور دجاج مقلي، بصل مقلي، جبنة، فطر، ذرة", price:380},
  // البطاطا
  {id:"p1", cat:"potato", name:"ساندويش بطاطا خبز", desc:"بطاطا حرّة", price:100},
  {id:"p2", cat:"potato", name:"سبيسيال", desc:"ساندويش بطاطا مع جبنة، ذرة وفطر", price:200},
  {id:"p3", cat:"potato", name:"بطاطا مع جبنة", desc:"ساندويش بطاطا مع جبنة حرّة", price:170},
  {id:"p4", cat:"potato", name:"Boom Frit", desc:"بطاطا مقلية مع كاتشب", price:120},
  // الوجبات
  {id:"m1", cat:"meals", name:"وجبة اسكالوب", desc:"", price:580},
  {id:"m2", cat:"meals", name:"وجبة كريسبي", desc:"", price:550},
  {id:"m3", cat:"meals", name:"وجبة زنجر", desc:"", price:650},
  {id:"m4", cat:"meals", name:"فروج", desc:"", price:1000},
  {id:"m5", cat:"meals", name:"نصف فروج", desc:"نصف فروج متبّل مع بطاطا", price:600},
  {id:"m6", cat:"meals", name:"Magnum Meal", desc:"", price:650},
  {id:"m7", cat:"meals", name:"Shish Meal", desc:"سيخ شيش، بطاطا، ثوم، مخلل، كولسلو", price:580}
];
const byId = Object.fromEntries(MENU.map(i=>[i.id,i]));
let cart = {};
try{ cart = JSON.parse(localStorage.getItem("bistro_cart")||"{}"); }catch(e){ cart={}; }
let activeCat = "all";
let delivery = true;

const fmt = n => n.toLocaleString("en-US");
const $ = id => document.getElementById(id);

function save(){ localStorage.setItem("bistro_cart", JSON.stringify(cart)); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((a,[id,q])=>a+byId[id].price*q,0); }

function renderChips(){
  const el = $("chips");
  el.innerHTML = `<button class="chip${activeCat==="all"?" active":""}" data-c="all">الكل 🍽️</button>` +
    CATS.map(c=>`<button class="chip${activeCat===c.id?" active":""}" data-c="${c.id}">${c.icon} ${c.name}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ activeCat=b.dataset.c; renderChips(); renderMenu(); });
}
function stepperHTML(id){
  const q = cart[id]||0;
  if(q===0) return `<div class="stepper"><button class="add" onclick="chQty('${id}',1)">أضف +</button></div>`;
  return `<div class="stepper"><button onclick="chQty('${id}',1)">+</button><span class="qty">${q}</span><button onclick="chQty('${id}',-1)">−</button></div>`;
}
function renderMenu(){
  const main = $("menu");
  const cats = activeCat==="all" ? CATS : CATS.filter(c=>c.id===activeCat);
  main.innerHTML = cats.map(c=>{
    const items = MENU.filter(i=>i.cat===c.id);
    return `<section class="cat" id="cat-${c.id}"><h2>${c.icon} ${c.name} <span class="count">${items.length}</span></h2>` +
      items.map(i=>`<div class="item"><div class="info"><div class="name">${i.name}</div>` +
        (i.desc?`<div class="desc">${i.desc}</div>`:"") +
        `<div class="price">${fmt(i.price)} ل.س</div></div>${stepperHTML(i.id)}</div>`).join("") + `</section>`;
  }).join("");
  updateBar();
}
function chQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  save(); renderMenu();
}
function updateBar(){
  const n = cartCount(), t = cartTotal(), bar = $("cartbar");
  if(n===0){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("cartN").textContent = `🛒 ${n} ${n===1?"صنف":n===2?"صنفان":"أصناف"}`;
  $("cartT").textContent = `${fmt(t)} ل.س`;
}
function openOrder(){
  if(cartCount()===0) return;
  const lines = Object.entries(cart).map(([id,q])=>{
    const i=byId[id];
    return `<div class="ln"><span>${q} × ${i.name}</span><span>${fmt(i.price*q)} ل.س</span></div>`;
  }).join("");
  $("orderLines").innerHTML = lines + `<div class="ln total"><span>المجموع</span><span>${fmt(cartTotal())} ل.س</span></div>`;
  $("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeOrder(){ $("overlay").classList.remove("show"); document.body.style.overflow=""; }

$("goOrder").onclick = openOrder;
$("cancelOrder").onclick = closeOrder;
$("overlay").addEventListener("click", e=>{ if(e.target===$("overlay")) closeOrder(); });
$("segD").onclick = ()=>{ delivery=true; $("segD").classList.add("active"); $("segP").classList.remove("active"); $("addrField").style.display=""; };
$("segP").onclick = ()=>{ delivery=false; $("segP").classList.add("active"); $("segD").classList.remove("active"); $("addrField").style.display="none"; };

$("sendWa").onclick = ()=>{
  const name=$("fName").value.trim(), phone=$("fPhone").value.trim();
  if(!name){ alert("فضلاً اكتب الاسم الكريم"); $("fName").focus(); return; }
  if(!phone){ alert("فضلاً اكتب رقم الهاتف"); $("fPhone").focus(); return; }
  const addr=$("fAddr").value.trim(), notes=$("fNotes").value.trim();
  const L=[];
  L.push("🍔 طلب جديد — Bistro بيسترو");
  L.push("———————————");
  Object.entries(cart).forEach(([id,q])=>{ const i=byId[id]; L.push(`${q} × ${i.name} — ${fmt(i.price*q)} ل.س`); });
  L.push("———————————");
  L.push(`💰 المجموع: ${fmt(cartTotal())} ل.س`);
  L.push(`👤 الاسم: ${name}`);
  L.push(`📞 الهاتف: ${phone}`);
  L.push(delivery ? `🛵 توصيل إلى: ${addr||"—"}` : "🏃 استلام من المطعم");
  if(notes) L.push(`📝 ملاحظات: ${notes}`);
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(L.join("\n")), "_blank");
};

renderChips(); renderMenu();
</script>
<script>
/* Menu-open tracking (2026-10-19): fire-and-forget ping so Ali can see which
   restaurant owner opened their menu demo link. No cookies, no PII — the server
   only stores the menu slug + timestamp (+hashed IP for country, same as the
   clinic demos' analytics). One ping per browser tab session. */
(function(){try{
  var m=location.pathname.match(/\/menu-demo\/([a-z0-9-]+)\/?(?:[?#]|$)/);
  if(!m)return;
  var slug=m[1];
  if(sessionStorage.getItem('menu_open_logged')===slug)return;
  sessionStorage.setItem('menu_open_logged',slug);
  fetch('https://kindly-anaconda-422.convex.site/trackVisit',{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify({type:'menu_open',label:slug,path:'/menu/'+slug}),
    keepalive:true
  }).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
