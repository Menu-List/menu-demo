<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beef Burger | قائمة الطعام</title>
<meta name="description" content="قائمة طعام بيف برغر (اللاذقية) — برغر وشاورما ومشاوي على الفحم. اختار وجبتك واطلبها مباشرة عبر واتساب.">
<meta property="og:type" content="website">
<meta property="og:title" content="Beef Burger | قائمة الطعام">
<meta property="og:description" content="برغر وشاورما ومشاوي على الفحم 🔥 اختار وجبتك واطلبها مباشرة عبر واتساب">
<meta property="og:image" content="https://menu-list.github.io/menu-demo/beef/og.png">
<meta property="og:url" content="https://menu-list.github.io/menu-demo/beef/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1512; --muted:#8A7B63; --cream:#FBF6EE; --card:#FFFFFF; --line:#EBDCBB;
  --dark:#0D0B09; --gold:#C9962E; --gold-lt:#E8B93C; --wa:#1FAF54; --wa-dark:#178A42;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}
.hero{background:radial-gradient(circle at 50% 0%,#2b2118 0%,#0D0B09 70%);color:#fff;text-align:center;padding:30px 18px 24px;position:relative;overflow:hidden}
.hero img.logo{width:min(210px,56vw);border-radius:50%;box-shadow:0 8px 28px rgba(0,0,0,.6);border:3px solid var(--gold)}
.hero h1{font-size:28px;font-weight:900;margin-top:12px;letter-spacing:.5px}
.hero h1 .en{direction:ltr;display:inline-block;color:var(--gold-lt)}
.hero p{font-weight:600;font-size:14px;color:#C9BBA0;margin-top:4px}
.hero .tag{display:inline-block;margin-top:12px;background:var(--gold);color:#0D0B09;padding:6px 18px;border-radius:999px;font-size:13px;font-weight:800}
.chips{position:sticky;top:0;z-index:50;background:var(--cream);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.active{background:#0D0B09;border-color:#0D0B09;color:var(--gold-lt)}
main{max-width:640px;margin:0 auto;padding:6px 14px}
section.cat{margin-top:18px}
section.cat h2{font-size:20px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
section.cat h2 .count{background:#F0E4C8;color:#8A6B23;font-size:12px;padding:2px 10px;border-radius:999px}
.catnote{background:#0D0B09;color:#EAD9A8;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:13px;line-height:1.9}
.catnote b{color:var(--gold-lt)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(26,21,18,.06)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:800;font-size:16px}
.item .price{font-size:14px;font-weight:800;color:#9A6E1C;margin-top:2px}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid #0D0B09;background:#fff;color:#0D0B09;font-size:20px;font-weight:900;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:#0D0B09;color:var(--gold-lt)}
.stepper .qty{font-weight:900;font-size:17px;min-width:24px;text-align:center}
.stepper .add{width:auto;padding:0 18px;border-radius:999px;font-size:14px;height:38px;font-family:inherit}
.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#0D0B09;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.35)}
.cartbar.show{display:flex}
.cartbar .sum{flex:1}
.cartbar .sum .n{font-size:15px;color:#fff;font-weight:800}
.cartbar .sum .t{font-size:13px;color:var(--gold-lt);font-weight:700}
.cartbar .go{flex:0 0 auto;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:800;font-size:16px;padding:13px 26px;border-radius:14px;cursor:pointer}
.cartbar .go:active{background:var(--wa-dark)}
.overlay{position:fixed;inset:0;background:rgba(10,8,5,.6);z-index:70;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease;border-top:4px solid var(--gold)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.sheet .lines{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.sheet .lines .ln{display:flex;justify-content:space-between;padding:4px 0;font-weight:600}
.sheet .lines .total{border-top:2px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:900;font-size:16px}
.sheet .lines .pnote{font-size:12px;color:var(--muted);margin-top:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:inherit;font-weight:800;font-size:15px;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.seg button.active{border-color:#0D0B09;background:#0D0B09;color:var(--gold-lt)}
.sheet .send{width:100%;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:900;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;margin-top:6px}
.sheet .send:active{background:var(--wa-dark)}
.sheet .cancel{width:100%;background:none;border:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:12px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 16px 8px}
footer b{color:#0D0B09}
</style>
</head>
<body>

<header class="hero">
  <img class="logo" src="logo.jpg" alt="Beef Burger">
  <h1><span class="en">Beef Burger</span></h1>
  <p>برغر • شاورما • مشاوي على الفحم — اللاذقية</p>
  <span class="tag">اختار وجبتك واطلبها مباشرة عبر واتساب 👇</span>
</header>

<nav class="chips" id="chips"></nav>
<main id="menu"></main>

<div class="cartbar" id="cartbar">
  <div class="sum"><div class="n" id="cartN"></div><div class="t" id="cartT"></div></div>
  <button class="go" id="goOrder">إتمام الطلب</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>إتمام الطلب 🛒</h3>
    <p class="sub">راجع طلبك وعبّي بياناتك، وبكبسة وحدة بينبعت كل شي للمطعم عبر واتساب</p>
    <div class="lines" id="orderLines"></div>
    <div class="field"><label>الاسم الكريم</label><input id="fName" placeholder="مثال: علي حسن"></div>
    <div class="field"><label>رقم الهاتف</label><input id="fPhone" inputmode="tel" placeholder="09xxxxxxxx"></div>
    <div class="field"><label>طريقة الاستلام</label>
      <div class="seg">
        <button type="button" id="segD" class="active">توصيل 🛵</button>
        <button type="button" id="segP">استلام من المطعم 🏃</button>
      </div>
    </div>
    <div class="field" id="addrField"><label>عنوان التوصيل</label><input id="fAddr" placeholder="الحي، الشارع، علامة مميزة"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNotes" rows="2" placeholder="مثال: الصوص على جنب"></textarea></div>
    <button class="send" id="sendWa">تأكيد وإرسال عبر واتساب</button>
    <button class="cancel" id="cancelOrder">رجوع للقائمة</button>
  </div>
</div>

<footer><b>Beef Burger</b> — اللاذقية<br>برغر • شاورما • مشاوي 🔥</footer>

<script>
const WA_NUMBER = "963940010042";
const CART_KEY = "beef_cart";
const CUR = "ل.س";
const CATS = [
  {id:"burger",   name:"البرغر", icon:"🍔"},
  {id:"sandwich", name:"السندويش", icon:"🥖", note:"<b>كلشي عالَفحَم 🔥</b>"},
  {id:"shawarma", name:"الشاورما", icon:"🌯"},
  {id:"meals",    name:"الوجبات", icon:"🍽️"}
];
const MENU = [
  // البرغر
  {id:"b1", cat:"burger", name:"بيف برغر", price:500},
  {id:"b2", cat:"burger", name:"بيف برغر دبل", price:850},
  {id:"b3", cat:"burger", name:"هالأبينو بيف برغر", price:550},
  {id:"b4", cat:"burger", name:"تشكن برغر", price:370},
  {id:"b5", cat:"burger", name:"تشكن برغر دبل", price:620},
  {id:"b6", cat:"burger", name:"هالأبينو تشكن برغر", price:420},
  // السندويش
  {id:"s1", cat:"sandwich", name:"بطاطا", price:100},
  {id:"s2", cat:"sandwich", name:"بطاطا دبل", price:130},
  {id:"s3", cat:"sandwich", name:"بطاطا سيون", price:140},
  {id:"s4", cat:"sandwich", name:"عيش غرامي", price:250},
  {id:"s5", cat:"sandwich", name:"عيش باربيكيو", price:280},
  {id:"s6", cat:"sandwich", name:"كباب لحمة", price:340},
  {id:"s7", cat:"sandwich", name:"كباب فروج", price:220},
  {id:"s8", cat:"sandwich", name:"سجق", price:330},
  {id:"s9", cat:"sandwich", name:"سجق + جبنة", price:350},
  {id:"s10", cat:"sandwich", name:"صحن بطاطا وسط", price:150},
  {id:"s11", cat:"sandwich", name:"صحن بطاطا كبير", price:250},
  // الشاورما
  {id:"sh1", cat:"shawarma", name:"سندويشة شاورما", price:180},
  {id:"sh2", cat:"shawarma", name:"وجبة عربي شاورما", price:350},
  {id:"sh3", cat:"shawarma", name:"وجبة شاورما دبل", price:550},
  {id:"sh4", cat:"shawarma", name:"شاورما باليته", price:null},
  {id:"sh5", cat:"shawarma", name:"شاورما سيسبال", price:null},
  // الوجبات
  {id:"m1", cat:"meals", name:"وجبة شيش 250 غ", price:400},
  {id:"m2", cat:"meals", name:"وجبة كبير 400 غ", price:700},
  {id:"m3", cat:"meals", name:"وجبة دجاج 7 قطع", price:350},
  {id:"m4", cat:"meals", name:"وجبة دجاج 14 قطعة", price:600},
  {id:"m5", cat:"meals", name:"نصف كيلو بيش", price:700},
  {id:"m6", cat:"meals", name:"نصف كيلو كباب", price:150},
  {id:"m7", cat:"meals", name:"فروج كامل", price:135},
  {id:"m8", cat:"meals", name:"فخذ مشوية كيلو", price:950},
  {id:"m9", cat:"meals", name:"فخذ مشوية نصف كيلو", price:500}
];
const byId = Object.fromEntries(MENU.map(i=>[i.id,i]));
let cart = {};
try{ cart = JSON.parse(localStorage.getItem(CART_KEY)||"{}"); }catch(e){ cart={}; }
let activeCat = "all";
let delivery = true;

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");

function save(){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((a,[id,q])=>a+(byId[id].price||0)*q,0); }
function cartHasUnpriced(){ return Object.keys(cart).some(id=>byId[id].price==null); }
function priceHTML(i){ return i.price!=null ? `<div class="price">${fmt(i.price)} ${CUR}</div>` : ""; }

function renderChips(){
  const el = $("chips");
  el.innerHTML = `<button class="chip${activeCat==="all"?" active":""}" data-c="all">الكل 🍽️</button>` +
    CATS.map(c=>`<button class="chip${activeCat===c.id?" active":""}" data-c="${c.id}">${c.icon} ${c.name}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ activeCat=b.dataset.c; renderChips(); renderMenu(); });
}
function stepperHTML(id){
  const q = cart[id]||0;
  if(q===0) return `<div class="stepper"><button class="add" onclick="chQty('${id}',1)">أضف +</button></div>`;
  return `<div class="stepper"><button onclick="chQty('${id}',1)">+</button><span class="qty">${q}</span><button onclick="chQty('${id}',-1)">−</button></div>`;
}
function renderMenu(){
  const main = $("menu");
  const cats = activeCat==="all" ? CATS : CATS.filter(c=>c.id===activeCat);
  main.innerHTML = cats.map(c=>{
    const items = MENU.filter(i=>i.cat===c.id);
    return `<section class="cat" id="cat-${c.id}"><h2>${c.icon} ${c.name} <span class="count">${items.length}</span></h2>` +
      (c.note?`<div class="catnote">${c.note}</div>`:"") +
      items.map(i=>`<div class="item"><div class="info"><div class="name">${i.name}</div>${priceHTML(i)}</div>${stepperHTML(i.id)}</div>`).join("") + `</section>`;
  }).join("");
  updateBar();
}
function chQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  save(); renderMenu();
}
function updateBar(){
  const n = cartCount(), bar = $("cartbar");
  if(n===0){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("cartN").textContent = `🛒 ${n} ${n===1?"صنف":n===2?"صنفان":"أصناف"}`;
  $("cartT").textContent = `المجموع: ${fmt(cartTotal())} ${CUR}` + (cartHasUnpriced() ? " *" : "");
}
function openOrder(){
  if(cartCount()===0) return;
  const unp = cartHasUnpriced();
  $("orderLines").innerHTML = Object.entries(cart).map(([id,q])=>{
    const i=byId[id];
    const right = i.price!=null ? `${fmt(i.price*q)} ${CUR}` : "—";
    return `<div class="ln"><span>${q} × ${i.name}</span><span>${right}</span></div>`;
  }).join("") +
  `<div class="ln total"><span>المجموع</span><span>${fmt(cartTotal())} ${CUR}${unp?" *":""}</span></div>` +
  (unp ? `<div class="pnote">* أصناف بلا سعر محدد — تُحسب عند تأكيد الطلب مع المطعم</div>` : "");
  $("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeOrder(){ $("overlay").classList.remove("show"); document.body.style.overflow=""; }

$("goOrder").onclick = openOrder;
$("cancelOrder").onclick = closeOrder;
$("overlay").addEventListener("click", e=>{ if(e.target===$("overlay")) closeOrder(); });
$("segD").onclick = ()=>{ delivery=true; $("segD").classList.add("active"); $("segP").classList.remove("active"); $("addrField").style.display=""; };
$("segP").onclick = ()=>{ delivery=false; $("segP").classList.add("active"); $("segD").classList.remove("active"); $("addrField").style.display="none"; };

$("sendWa").onclick = ()=>{
  const name=$("fName").value.trim(), phone=$("fPhone").value.trim();
  if(!name){ alert("فضلاً اكتب الاسم الكريم"); $("fName").focus(); return; }
  if(!phone){ alert("فضلاً اكتب رقم الهاتف"); $("fPhone").focus(); return; }
  const addr=$("fAddr").value.trim(), notes=$("fNotes").value.trim();
  const L=[];
  L.push("🍔 طلب جديد — Beef Burger");
  L.push("———————————");
  Object.entries(cart).forEach(([id,q])=>{ const i=byId[id]; L.push(i.price!=null?`${q} × ${i.name} = ${fmt(i.price*q)} ${CUR}`:`${q} × ${i.name}`); });
  L.push("———————————");
  L.push(`المجموع: ${fmt(cartTotal())} ${CUR}${cartHasUnpriced()?" (+ أصناف بلا سعر محدد)":""}`);
  L.push(`👤 الاسم: ${name}`);
  L.push(`📞 الهاتف: ${phone}`);
  L.push(delivery ? `🛵 توصيل إلى: ${addr||"—"}` : "🏃 استلام من المطعم");
  if(notes) L.push(`📝 ملاحظات: ${notes}`);
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(L.join("\n")), "_blank");
};

renderChips(); renderMenu();
</script>

<script>
/* Menu-open tracking (2026-10-19): fire-and-forget ping so Ali can see which
   restaurant owner opened their menu demo link. No cookies, no PII — the server
   only stores the menu slug + timestamp (+hashed IP for country, same as the
   clinic demos' analytics). One ping per browser tab session. */
(function(){try{
  var m=location.pathname.match(/\/menu-demo\/([a-z0-9-]+)\/?(?:[?#]|$)/);
  if(!m)return;
  var slug=m[1];
  if(sessionStorage.getItem('menu_open_logged')===slug)return;
  sessionStorage.setItem('menu_open_logged',slug);
  fetch('https://kindly-anaconda-422.convex.site/trackVisit',{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify({type:'menu_open',label:slug,path:'/menu/'+slug}),
    keepalive:true
  }).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
