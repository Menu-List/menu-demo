<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بيتزا وفطائر باباي | قائمة الطعام</title>
<meta name="description" content="قائمة طعام مطعم بيتزا وفطائر باباي (اللاذقية). اختار وجبتك واطلبها مباشرة عبر واتساب.">
<meta property="og:type" content="website">
<meta property="og:title" content="بيتزا وفطائر باباي | قائمة الطعام">
<meta property="og:description" content="اختار وجبتك من القائمة واطلبها مباشرة عبر واتساب 🍕">
<meta property="og:image" content="https://menu-list.github.io/menu-demo/babai/og.png">
<meta property="og:url" content="https://menu-list.github.io/menu-demo/babai/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#C81A02; --brand-dark:#9A1300; --gold:#D4A017; --gold-soft:#F7ECD2;
  --ink:#2A1A10; --muted:#8A7358; --cream:#FBF3E0; --card:#FFFDF6; --line:#EBDCB8;
  --wa:#1FAF54; --wa-dark:#178A42;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}
.hero{background:radial-gradient(circle at 50% 0%,#3A2412 0%,#1E120A 70%);text-align:center;padding:28px 18px 24px;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
.hero img.logo{width:min(250px,68vw);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.5);border:2px solid var(--gold)}
.hero h1{font-size:28px;font-weight:900;margin-top:12px;color:#F7ECD2}
.hero h1 .r{color:#E8572A}
.hero p{font-weight:700;font-size:15px;color:var(--gold);opacity:.95}
.hero .tag{display:inline-block;margin-top:10px;background:var(--brand);color:#fff;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700}
.chips{position:sticky;top:0;z-index:50;background:var(--cream);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 14px}
section.cat{margin-top:18px}
section.cat h2{font-size:20px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
section.cat h2 .count{background:var(--gold-soft);color:#8a6d00;font-size:12px;padding:2px 10px;border-radius:999px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(42,26,16,.06)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:800;font-size:16px}
.item .name .size{display:inline-block;background:var(--gold-soft);color:#8a6d00;font-size:11px;font-weight:800;padding:1px 9px;border-radius:999px;margin-right:6px;vertical-align:middle}
.item .price{font-weight:900;color:var(--brand);font-size:16px;margin-top:6px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--brand);background:#fff;color:var(--brand);font-size:20px;font-weight:900;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--brand);color:#fff}
.stepper .qty{font-weight:900;font-size:17px;min-width:24px;text-align:center}
.stepper .add{width:auto;padding:0 18px;border-radius:999px;font-size:14px;height:38px;font-family:inherit}
.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(42,26,16,.12)}
.cartbar.show{display:flex}
.cartbar .sum{flex:1}
.cartbar .sum .n{font-size:13px;color:var(--muted);font-weight:600}
.cartbar .sum .t{font-size:19px;font-weight:900}
.cartbar .go{flex:0 0 auto;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:800;font-size:16px;padding:13px 26px;border-radius:14px;cursor:pointer}
.cartbar .go:active{background:var(--wa-dark)}
.overlay{position:fixed;inset:0;background:rgba(30,18,10,.55);z-index:70;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s ease;border-top:3px solid var(--gold)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.sheet .lines{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.sheet .lines .ln{display:flex;justify-content:space-between;padding:4px 0;font-weight:600}
.sheet .lines .total{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:900;font-size:16px;color:var(--brand)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:inherit;font-weight:800;font-size:15px;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.seg button.active{border-color:var(--brand);background:#FDE9E4;color:var(--brand)}
.sheet .send{width:100%;background:var(--wa);color:#fff;border:none;font-family:inherit;font-weight:900;font-size:17px;padding:15px;border-radius:14px;cursor:pointer;margin-top:6px}
.sheet .send:active{background:var(--wa-dark)}
.sheet .cancel{width:100%;background:none;border:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:12px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 16px 8px}
footer b{color:var(--brand)}
</style>
</head>
<body>

<header class="hero">
  <img class="logo" src="logo.jpg" alt="بيتزا وفطائر باباي">
  <h1>مطعم <span class="r">باباي</span></h1>
  <p>بيتزا وفطائر — اللاذقية</p>
  <span class="tag">اختار وجبتك واطلبها مباشرة عبر واتساب 👇</span>
</header>

<nav class="chips" id="chips"></nav>
<main id="menu"></main>

<div class="cartbar" id="cartbar">
  <div class="sum"><div class="n" id="cartN"></div><div class="t" id="cartT"></div></div>
  <button class="go" id="goOrder">إتمام الطلب</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>إتمام الطلب 🛒</h3>
    <p class="sub">راجع طلبك وعبّي بياناتك، وبكبسة وحدة بينبعت كل شي للمطعم عبر واتساب</p>
    <div class="lines" id="orderLines"></div>
    <div class="field"><label>الاسم الكريم</label><input id="fName" placeholder="مثال: علي حسن"></div>
    <div class="field"><label>رقم الهاتف</label><input id="fPhone" inputmode="tel" placeholder="09xxxxxxxx"></div>
    <div class="field"><label>طريقة الاستلام</label>
      <div class="seg">
        <button type="button" id="segD" class="active">توصيل 🛵</button>
        <button type="button" id="segP">استلام من المطعم 🏃</button>
      </div>
    </div>
    <div class="field" id="addrField"><label>عنوان التوصيل</label><input id="fAddr" placeholder="الحي، الشارع، علامة مميزة"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNotes" rows="2" placeholder="مثال: جبنة زيادة"></textarea></div>
    <button class="send" id="sendWa">تأكيد وإرسال عبر واتساب</button>
    <button class="cancel" id="cancelOrder">رجوع للقائمة</button>
  </div>
</div>

<footer>مطعم <b>بيتزا وفطائر باباي</b> — اللاذقية<br>طعم لا يُقاوم... كل قطعة حكاية 🍕</footer>

<script>
const WA_NUMBER = "963936458888";
const CART_KEY = "babai_cart";
const CATS = [
  {id:"pizza",  name:"البيتزا", icon:"🍕"},
  {id:"fatayer", name:"الفطائر", icon:"🥐"},
  {id:"cheese", name:"فطائر الأجبان والألبان", icon:"🧀"},
  {id:"other",  name:"أصناف أخرى وحلو", icon:"🍫"}
];
const MENU = [
  // البيتزا — حجم عائلي 500 / وسط 250
  {id:"pz1f", cat:"pizza", name:"بيتزا فصول", size:"عائلي", price:500},
  {id:"pz1m", cat:"pizza", name:"بيتزا فصول", size:"وسط", price:250},
  {id:"pz2f", cat:"pizza", name:"بيتزا مكسيكانو", size:"عائلي", price:500},
  {id:"pz2m", cat:"pizza", name:"بيتزا مكسيكانو", size:"وسط", price:250},
  {id:"pz3f", cat:"pizza", name:"بيتزا سجق", size:"عائلي", price:500},
  {id:"pz3m", cat:"pizza", name:"بيتزا سجق", size:"وسط", price:250},
  {id:"pz4f", cat:"pizza", name:"بيتزا خضار", size:"عائلي", price:500},
  {id:"pz4m", cat:"pizza", name:"بيتزا خضار", size:"وسط", price:250},
  {id:"pz5f", cat:"pizza", name:"بيتزا مرغريتا", size:"عائلي", price:500},
  {id:"pz5m", cat:"pizza", name:"بيتزا مرغريتا", size:"وسط", price:250},
  {id:"pz6f", cat:"pizza", name:"بيتزا فطر", size:"عائلي", price:500},
  {id:"pz6m", cat:"pizza", name:"بيتزا فطر", size:"وسط", price:250},
  // الفطائر
  {id:"f1", cat:"fatayer", name:"فطيرة باباي", price:100},
  {id:"f2", cat:"fatayer", name:"مكسيكانو", price:90},
  {id:"f3", cat:"fatayer", name:"فاهيتا", price:90},
  {id:"f4", cat:"fatayer", name:"قشقوان فطر", price:75},
  {id:"f5", cat:"fatayer", name:"قشقوان سجق", price:75},
  {id:"f6", cat:"fatayer", name:"طوشكا", price:75},
  {id:"f7", cat:"fatayer", name:"بيتزا صاج", price:75},
  {id:"f8", cat:"fatayer", name:"بيتزا سمول", price:75},
  {id:"f9", cat:"fatayer", name:"سجق", price:60},
  {id:"f10", cat:"fatayer", name:"بطاطا وقشقوان", price:60},
  {id:"f11", cat:"fatayer", name:"سلق", price:50},
  // فطائر الأجبان والألبان
  {id:"c1", cat:"cheese", name:"جبنة زعتر أخضر", price:100},
  {id:"c2", cat:"cheese", name:"جبنة نعناع", price:75},
  {id:"c3", cat:"cheese", name:"جبنة كردية", price:75},
  {id:"c4", cat:"cheese", name:"جبنة سادة", price:50},
  {id:"c5", cat:"cheese", name:"جبنة بيروتية", price:50},
  {id:"c6", cat:"cheese", name:"جبنة كيري", price:50},
  {id:"c7", cat:"cheese", name:"جبنة وزبدة", price:50},
  // الأصناف الأخرى والحلو
  {id:"o1", cat:"other", name:"لحمة سودا", price:250},
  {id:"o2", cat:"other", name:"مرتديلا", price:250},
  {id:"o3", cat:"other", name:"شوكولا", price:250},
  {id:"o4", cat:"other", name:"شيش", price:60},
  {id:"o5", cat:"other", name:"زعتر", price:50},
  {id:"o6", cat:"other", name:"فليفلة", price:50},
  {id:"o7", cat:"other", name:"زيتون", price:50},
  {id:"o8", cat:"other", name:"شوكولا وزبدة", price:50}
];
const byId = Object.fromEntries(MENU.map(i=>[i.id,i]));
let cart = {};
try{ cart = JSON.parse(localStorage.getItem(CART_KEY)||"{}"); }catch(e){ cart={}; }
let activeCat = "all";
let delivery = true;

const fmt = n => n.toLocaleString("en-US");
const $ = id => document.getElementById(id);

function save(){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((a,[id,q])=>a+byId[id].price*q,0); }
function itemLabel(i){ return i.size ? `${i.name} <span class="size">${i.size}</span>` : i.name; }
function itemPlain(i){ return i.size ? `${i.name} (${i.size})` : i.name; }

function renderChips(){
  const el = $("chips");
  el.innerHTML = `<button class="chip${activeCat==="all"?" active":""}" data-c="all">الكل 🍽️</button>` +
    CATS.map(c=>`<button class="chip${activeCat===c.id?" active":""}" data-c="${c.id}">${c.icon} ${c.name}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ activeCat=b.dataset.c; renderChips(); renderMenu(); });
}
function stepperHTML(id){
  const q = cart[id]||0;
  if(q===0) return `<div class="stepper"><button class="add" onclick="chQty('${id}',1)">أضف +</button></div>`;
  return `<div class="stepper"><button onclick="chQty('${id}',1)">+</button><span class="qty">${q}</span><button onclick="chQty('${id}',-1)">−</button></div>`;
}
function renderMenu(){
  const main = $("menu");
  const cats = activeCat==="all" ? CATS : CATS.filter(c=>c.id===activeCat);
  main.innerHTML = cats.map(c=>{
    const items = MENU.filter(i=>i.cat===c.id);
    return `<section class="cat" id="cat-${c.id}"><h2>${c.icon} ${c.name} <span class="count">${items.length}</span></h2>` +
      items.map(i=>`<div class="item"><div class="info"><div class="name">${itemLabel(i)}</div>` +
        `<div class="price">${fmt(i.price)} ل.س</div></div>${stepperHTML(i.id)}</div>`).join("") + `</section>`;
  }).join("");
  updateBar();
}
function chQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  save(); renderMenu();
}
function updateBar(){
  const n = cartCount(), t = cartTotal(), bar = $("cartbar");
  if(n===0){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  $("cartN").textContent = `🛒 ${n} ${n===1?"صنف":n===2?"صنفان":"أصناف"}`;
  $("cartT").textContent = `${fmt(t)} ل.س`;
}
function openOrder(){
  if(cartCount()===0) return;
  const lines = Object.entries(cart).map(([id,q])=>{
    const i=byId[id];
    return `<div class="ln"><span>${q} × ${itemPlain(i)}</span><span>${fmt(i.price*q)} ل.س</span></div>`;
  }).join("");
  $("orderLines").innerHTML = lines + `<div class="ln total"><span>المجموع</span><span>${fmt(cartTotal())} ل.س</span></div>`;
  $("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeOrder(){ $("overlay").classList.remove("show"); document.body.style.overflow=""; }

$("goOrder").onclick = openOrder;
$("cancelOrder").onclick = closeOrder;
$("overlay").addEventListener("click", e=>{ if(e.target===$("overlay")) closeOrder(); });
$("segD").onclick = ()=>{ delivery=true; $("segD").classList.add("active"); $("segP").classList.remove("active"); $("addrField").style.display=""; };
$("segP").onclick = ()=>{ delivery=false; $("segP").classList.add("active"); $("segD").classList.remove("active"); $("addrField").style.display="none"; };

$("sendWa").onclick = ()=>{
  const name=$("fName").value.trim(), phone=$("fPhone").value.trim();
  if(!name){ alert("فضلاً اكتب الاسم الكريم"); $("fName").focus(); return; }
  if(!phone){ alert("فضلاً اكتب رقم الهاتف"); $("fPhone").focus(); return; }
  const addr=$("fAddr").value.trim(), notes=$("fNotes").value.trim();
  const L=[];
  L.push("🍕 طلب جديد — بيتزا وفطائر باباي");
  L.push("———————————");
  Object.entries(cart).forEach(([id,q])=>{ const i=byId[id]; L.push(`${q} × ${itemPlain(i)} — ${fmt(i.price*q)} ل.س`); });
  L.push("———————————");
  L.push(`💰 المجموع: ${fmt(cartTotal())} ل.س`);
  L.push(`👤 الاسم: ${name}`);
  L.push(`📞 الهاتف: ${phone}`);
  L.push(delivery ? `🛵 توصيل إلى: ${addr||"—"}` : "🏃 استلام من المطعم");
  if(notes) L.push(`📝 ملاحظات: ${notes}`);
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(L.join("\n")), "_blank");
};

renderChips(); renderMenu();
</script>
</body>
</html>
